<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="#0c101d"/>
  
  <g transform="translate(60, 70)">
    <rect x="0" y="50" width="110" height="170" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="55" y="125" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Input Image</text>
    <text x="55" y="145" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">224x224 RGB</text>
    
    <path d="M 120 135 L 170 135" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="180" y="30" width="100" height="210" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="230" y="125" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">ResNet-18</text>
    <text x="230" y="145" text-anchor="middle" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="10">Residual Blocks</text>

    <path d="M 290 135 L 340 135" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="350" y="65" width="95" height="140" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="397" y="125" text-anchor="middle" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Transfer Learning</text>
    <text x="397" y="145" text-anchor="middle" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="10">Fine-Tuned FC</text>
  </g>

  <rect x="520" y="70" width="230" height="255" rx="14" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="540" y="90" width="190" height="30" rx="6" fill="url(#cGrad)"/>
  <text x="635" y="110" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CattleLens AI Classifier</text>
  
  <text x="540" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Target Domain:</text>
  <text x="540" y="170" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Indian Cattle &amp; Buffalo</text>
  <rect x="540" y="190" width="190" height="1" fill="#1f2937"/>
  <text x="540" y="215" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Architecture:</text>
  <text x="540" y="235" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">PyTorch ResNet-18</text>
  <text x="540" y="265" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Application Scope:</text>
  <text x="540" y="285" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Dairy &amp; Agricultural Sector</text>

  <rect x="60" y="370" width="690" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="85" y="405" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">PIPELINE STAGES:</text>
  <text x="215" y="405" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Dataset Curation &rarr; Normalization &rarr; Feature Map Extraction &rarr; Breed Classification</text>
