<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <rect width="800" height="480" rx="16" fill="#0c141d"/>
  
  <rect x="50" y="35" width="140" height="28" rx="14" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1"/>
  <circle cx="68" cy="49" r="4" fill="#fbbf24"/>
  <text x="80" y="53" fill="#fef08a" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">IN DEVELOPMENT</text>
  <text x="210" y="53" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Proposed Architectural &amp; REST Design Specification</text>

  <g transform="translate(50, 85)">
    <rect x="0" y="0" width="330" height="355" rx="12" fill="#111c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="25" y="35" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Proposed Spring Boot Stack</text>
    
    <rect x="25" y="55" width="280" height="44" rx="6" fill="#1e293b"/>
    <text x="40" y="75" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">GET /api/v1/stations/{id}/slots</text>
    <text x="40" y="91" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Query available charging points</text>

    <rect x="25" y="110" width="280" height="44" rx="6" fill="#1e293b"/>
    <text x="40" y="130" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">POST /api/v1/bookings</text>
    <text x="40" y="146" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Reserve charging window</text>

    <rect x="25" y="165" width="280" height="44" rx="6" fill="#1e293b"/>
    <text x="40" y="185" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="600">PUT /api/v1/bookings/{id}/cancel</text>
    <text x="40" y="201" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Release slot allocation</text>

    <rect x="25" y="230" width="280" height="100" rx="8" fill="#0a101b" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="255" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Framework:</text>
    <text x="130" y="255" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Java 21 + Spring Boot 3</text>
    <text x="40" y="280" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">ORM / DB:</text>
    <text x="130" y="280" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Spring Data JPA + MySQL</text>
    <text x="40" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Build Tool:</text>
    <text x="130" y="305" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Apache Maven</text>
  </g>

  <g transform="translate(410, 85)">
    <rect x="0" y="0" width="340" height="355" rx="12" fill="#111c2e" stroke="#1e293b" stroke-width="1.5"/>
    <text x="25" y="35" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Proposed Relational Entities</text>
    
    <rect x="25" y="55" width="290" height="78" rx="8" fill="#1a2438" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="77" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ChargingStation (Entity)</text>
    <text x="40" y="97" fill="#94a3b8" font-family="monospace" font-size="10">id, name, latitude, longitude, total_ports</text>
    <text x="40" y="117" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">1 : N relationship with ChargingSlot</text>

    <path d="M 170 133 L 170 155" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>

    <rect x="25" y="155" width="290" height="78" rx="8" fill="#1a2438" stroke="#10b981" stroke-width="1"/>
    <text x="40" y="177" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ChargingSlot (Entity)</text>
    <text x="40" y="197" fill="#94a3b8" font-family="monospace" font-size="10">id, station_id, port_type, power_kw, status</text>
    <text x="40" y="217" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">1 : N relationship with BookingRecord</text>

    <path d="M 170 233 L 170 255" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>

    <rect x="25" y="255" width="290" height="70" rx="8" fill="#1a2438" stroke="#fbbf24" stroke-width="1"/>
    <text x="40" y="277" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">BookingRecord (Entity)</text>
    <text x="40" y="297" fill="#94a3b8" font-family="monospace" font-size="10">id, user_id, slot_id, start_time, duration, status</text>
  </g>
</svg>