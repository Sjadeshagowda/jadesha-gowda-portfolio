<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <rect width="800" height="480" rx="16" fill="#0b121e"/>
  
  <rect x="40" y="35" width="720" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="63" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">ServiceNow Application Engine</text>
  <text x="290" y="63" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">/ Parking Management System Architecture</text>
  
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="210" height="150" rx="10" fill="#131d33" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="10" fill="#0369a1"/>
    <text x="105" y="21" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Parking Slots Records</text>
    <text x="15" y="58" fill="#cbd5e1" font-family="monospace" font-size="11">+ slot_number (String)</text>
    <text x="15" y="80" fill="#cbd5e1" font-family="monospace" font-size="11">+ slot_type (Choice)</text>
    <text x="15" y="102" fill="#cbd5e1" font-family="monospace" font-size="11">+ floor_level (Integer)</text>
    <text x="15" y="124" fill="#38bdf8" font-family="monospace" font-size="11">+ is_available (Boolean)</text>

    <rect x="245" y="0" width="210" height="150" rx="10" fill="#131d33" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="245" y="0" width="210" height="32" rx="10" fill="#4338ca"/>
    <text x="350" y="21" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Parking Bookings Records</text>
    <text x="260" y="58" fill="#cbd5e1" font-family="monospace" font-size="11">+ booking_ref (AutoNum)</text>
    <text x="260" y="80" fill="#cbd5e1" font-family="monospace" font-size="11">+ slot (Reference)</text>
    <text x="260" y="102" fill="#cbd5e1" font-family="monospace" font-size="11">+ vehicle (Reference)</text>
    <text x="260" y="124" fill="#818cf8" font-family="monospace" font-size="11">+ state (Choice)</text>

    <rect x="490" y="0" width="210" height="150" rx="10" fill="#131d33" stroke="#10b981" stroke-width="1.5"/>
    <rect x="490" y="0" width="210" height="32" rx="10" fill="#047857"/>
    <text x="595" y="21" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Vehicle Records</text>
    <text x="505" y="58" fill="#cbd5e1" font-family="monospace" font-size="11">+ plate_number (String)</text>
    <text x="505" y="80" fill="#cbd5e1" font-family="monospace" font-size="11">+ owner_user (SysUser)</text>
    <text x="505" y="102" fill="#cbd5e1" font-family="monospace" font-size="11">+ vehicle_category</text>
    <text x="505" y="124" fill="#10b981" font-family="monospace" font-size="11">+ pass_status (Active)</text>
  </g>

  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="700" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="25" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">ServiceNow Business Logic &amp; Workflow Automation</text>
    
    <rect x="25" y="52" width="310" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="78" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Business Rules (GlideRecord):</text>
    <text x="40" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Pre-insert query validation prevents duplicate / conflicting slot reservations in real-time.</text>
    
    <rect x="365" y="52" width="310" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="380" y="78" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Flow Designer &amp; ACLs:</text>
    <text x="380" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Automates approval cycle, manages slot lifecycle transitions, and secures table access.</text>
  </g>
</svg>